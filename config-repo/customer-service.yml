server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/customers_db?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    openfeign:
      client:
        config:
          product-service:
            connect-timeout: 2000
            read-timeout: 5000

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-minutes: 60
    admin-password: ${ADMIN_PASSWORD}
    user-password: ${USER_PASSWORD}